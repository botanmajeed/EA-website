<section class="player-setup screen-section" aria-labelledby="player-setup-title">
    <header class="screen-heading">
        <div class="screen-heading__content">
            <span class="screen-heading__eyebrow">Step 1 of 4</span>
            <h1 id="player-setup-title">Add tournament players</h1>
            <p class="screen-heading__description">Enter each player's information before creating the knockout bracket.
            </p>
        </div>

        <div class="player-counter" aria-live="polite">
            <strong id="player-total">0</strong>
            <span>Players</span>
        </div>
    </header>

    <div class="player-setup__layout">
        <section class="panel player-form-panel" aria-labelledby="player-form-title">
            <header class="panel__header">
                <div>
                    <span class="status-badge status-badge--info">New player</span>
                    <h2 id="player-form-title">Player information</h2>
                </div>
            </header>

            <div class="panel__body">
                <form id="player-form" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label for="player-name">Player name</label>
                            <input id="player-name" name="name" type="text" placeholder="Example: Botan"
                                autocomplete="off" maxlength="50" required>
                            <small class="field__error" data-error-for="name"></small>
                        </div>

                        <div class="field">
                            <label for="player-game-id">Player ID</label>
                            <input id="player-game-id" name="playerId" type="text" placeholder="EA or game ID"
                                autocomplete="off" maxlength="50" required>
                            <small class="field__error" data-error-for="playerId"></small>
                        </div>

                        <div class="field">
                            <label for="player-telegram-id">Telegram ID</label>
                            <div class="input-prefix">
                                <span class="input-prefix__value" aria-hidden="true">@</span>
                                <input id="player-telegram-id" name="telegramId" type="text"
                                    placeholder="telegram_username" autocomplete="off" maxlength="50" required>
                            </div>
                            <small class="field__error" data-error-for="telegramId"></small>
                        </div>

                        <div class="field">
                            <label for="player-console">Console</label>
                            <select id="player-console" name="console" required>
                                <option value="">Select a console</option>
                                <option value="ps5">PlayStation 5</option>
                                <option value="xbox-series">Xbox Series X|S</option>
                                <option value="pc">PC</option>
                                <option value="ps4">PlayStation 4</option>
                                <option value="xbox-one">Xbox One</option>
                            </select>
                            <small class="field__error" data-error-for="console"></small>
                        </div>
                    </div>

                    <button class="button button--primary button--block" type="submit">Add player</button>
                </form>
            </div>
        </section>

        <section class="panel player-roster-panel" aria-labelledby="player-roster-title">
            <header class="panel__header">
                <div>
                    <span class="status-badge">Tournament roster</span>
                    <h2 id="player-roster-title">Added players</h2>
                </div>
            </header>

            <div class="panel__body">
                <div class="player-list" id="player-list">
                    <div class="empty-state" id="player-list-empty">
                        <div class="empty-state__icon" aria-hidden="true">+</div>
                        <h3>No players added</h3>
                        <p>Players will appear here after you add them.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="screen-actions">
        <p id="player-setup-message" aria-live="polite">Add at least two players to continue.</p>
        <button class="button button--primary" id="continue-to-bracket" type="button" disabled>Create knockout
            bracket</button>
    </footer>
</section>
